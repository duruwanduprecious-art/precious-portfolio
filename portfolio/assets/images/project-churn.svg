<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220">
  <rect width="400" height="220" fill="#141b26"/>
  <rect x="0" y="0" width="400" height="220" fill="none" stroke="#263140" stroke-width="2"/>

  <!-- donut chart representing category/coupon breakdown -->
  <g transform="translate(110,105)">
    <circle r="55" fill="none" stroke="#1b2430" stroke-width="18"/>
    <circle r="55" fill="none" stroke="#00d9ff" stroke-width="18"
      stroke-dasharray="180 345" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="55" fill="none" stroke="#00d9ff" stroke-width="18" opacity="0.4"
      stroke-dasharray="90 345" stroke-dashoffset="-180" transform="rotate(-90)"/>
  </g>

  <!-- shopping cart icon -->
  <g transform="translate(280,105)">
    <circle cx="0" cy="0" r="40" fill="#1b2430" stroke="#263140"/>
    <path d="M-16,-14 h6 l4,20 h16 l5,-14 h-21" fill="none" stroke="#00d9ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="-6" cy="12" r="3" fill="#00d9ff"/>
    <circle cx="10" cy="12" r="3" fill="#00d9ff"/>
  </g>

  <text x="40" y="195" fill="#64707d" font-family="monospace" font-size="12">E-Commerce Sales EDA</text>
</svg>
